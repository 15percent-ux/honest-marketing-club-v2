name: Threads → LINE スクリプトのテスト

on:
  push:
    paths:
      - 'scripts/threads-line/**'
      - '.github/workflows/threads-line-*.yml'
  pull_request:
    paths:
      - 'scripts/threads-line/**'
      - '.github/workflows/threads-line-*.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/threads-line/feed.test.mjs
