name: Threads → LINE 毎日配信

on:
  schedule:
    # 毎日 23:00 UTC = 08:00 JST。
    # 注意: schedule はデフォルトブランチ上のワークフローしか起動しないため、
    # 定期実行するにはこのファイルが main にマージされている必要がある。
    - cron: '0 23 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'LINE に送信せず、配信予定の内容をログに出すだけにする'
        type: boolean
        default: false

concurrency:
  group: threads-line-daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 新着スレッドを LINE に配信
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_TO: ${{ secrets.LINE_TO }}
          THREADS_FEED_URL: ${{ secrets.THREADS_FEED_URL }}
          THREADS_USERNAME: ${{ vars.THREADS_USERNAME }}
          MAX_POSTS_PER_RUN: ${{ vars.MAX_POSTS_PER_RUN }}
          LOOKBACK_HOURS: ${{ vars.LOOKBACK_HOURS }}
          NOTIFY_WHEN_EMPTY: ${{ vars.NOTIFY_WHEN_EMPTY }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: node scripts/threads-line/notify.mjs

      - name: 通知済み記録をコミット
        if: ${{ !inputs.dry_run }}
        run: |
          if git diff --quiet -- scripts/threads-line/state.json; then
            echo "state.json に変更なし。コミットをスキップします。"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/threads-line/state.json
          git commit -m 'chore(threads-line): 通知済み投稿を記録 [skip ci]'
          git push origin HEAD:${{ github.ref_name }}
